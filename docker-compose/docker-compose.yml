# ==============================================================================
# WVP-PRO 3.0.0 多容器编排（docker-compose 方案）
# ------------------------------------------------------------------------------
# 组件：wvp(Java+UI) + zlm(ZLMediaKit) + mysql8 + redis7
# 端口（容器内外一致）：
#   WVP 18080/tcp | SIP 5060 tcp+udp | ZLM HTTP 9092 | RTSP 554 | RTMP 1935
#   RTP 10000 tcp+udp（单端口收流模式）| RTC 8000 udp+tcp | SRT 9000/udp
# 常用命令：
#   docker compose up -d --build     # 首次构建并启动（构建 wvp 镜像耗时较长）
#   docker compose up -d             # 再次启动（镜像已构建）
#   docker compose logs -f wvp       # 查看 wvp 日志
#   docker compose down              # 停止并删除容器（数据卷保留在 ./data）
# 使用前请先按需修改 .env（重点：Stream_IP / SDP_IP / SIP_ShowIP / 各密码）
# ==============================================================================
name: wvp-pro

services:
  # ------------------------------ MySQL 8 ------------------------------
  mysql:
    image: mysql:8.0
    container_name: wvp-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 初始化时自动建库并授权 MYSQL_USER（初始化 SQL 在此库中执行）
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --innodb-buffer-pool-size=80M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      # 表名大小写不敏感（必须），首次初始化后不可更改
      - --lower-case-table-names=1
    volumes:
      - ./data/mysql:/var/lib/mysql
      # WVP 3.0.0 初始化 SQL（仅在数据卷为空时执行一次）
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - wvp-net

  # ------------------------------ Redis 7 ------------------------------
  redis:
    image: redis:7-alpine
    container_name: wvp-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PWD: ${REDIS_PWD}
    command: ["redis-server", "--requirepass", "${REDIS_PWD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PWD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - wvp-net

  # ------------------------------ ZLMediaKit ------------------------------
  # 官方镜像基于 ubuntu:24.04，MediaServer 工作目录 /opt/media/bin
  zlm:
    image: zlmediakit/zlmediakit:master
    container_name: wvp-zlm
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # 使用自定义配置（secret / 端口 / hook 指向 wvp）
    command: ["MediaServer", "-c", "/conf/config.ini", "-l", "0"]
    volumes:
      - ./config/zlm-config.ini:/conf/config.ini:ro
      # 录像文件（wvp 配置中的 record-path 指向此目录）
      - ./data/record:/opt/media/bin/www/record
      - ./logs/zlm:/opt/media/log
    ports:
      - "9092:9092/tcp"    # [播流] HTTP-FLV / WS-FLV / HLS / API
      - "554:554/tcp"      # [播流] RTSP
      - "1935:1935/tcp"    # [收流] RTMP
      - "10000:10000/tcp"  # [收流] RTP（单端口模式，用 SSRC 区分流）
      - "10000:10000/udp"  # [收流] RTP
      - "8000:8000/udp"    # [收流] WebRTC
      - "8000:8000/tcp"    # [收流] WebRTC TCP 模式
      - "9000:9000/udp"    # [收流] SRT（config.ini 默认关闭 SRT，可去掉本行）
    networks:
      - wvp-net

  # ------------------------------ WVP-PRO ------------------------------
  wvp:
    build:
      context: .
      dockerfile: wvp-image/Dockerfile
      args:
        WVP_GIT_URL: ${WVP_GIT_URL}
        WVP_GIT_REF: ${WVP_GIT_REF}
    image: ${WVP_IMAGE:-wvp-pro:3.0.0}
    container_name: wvp-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlm:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      RUN_ENV: docker
      # ---- 浏览器播流 / 设备收流地址（来自 .env，必须为宿主机真实 IP）----
      Stream_IP: ${Stream_IP}
      SDP_IP: ${SDP_IP}
      SIP_ShowIP: ${SIP_ShowIP}
      # ---- SIP 国标参数 ----
      SIP_Port: "5060"
      SIP_Domain: ${SIP_Domain}
      SIP_Id: ${SIP_Id}
      SIP_Password: ${SIP_Password}
      # ---- ZLM 互通（容器网络内使用服务名）----
      ZLM_HOST: zlm
      ZLM_HOOK_HOST: wvp
      ZLM_SERCERT: ${ZLM_SERCERT}
      ZLM_MEDIA_ID: zlmediakit-01
      MediaHttp: "9092"
      MediaRtsp: "554"
      MediaRtmp: "1935"
      MediaRtp: "10000"
      # 单端口收流模式（默认）；如需多端口，改为 true 并开放 30000-30500 映射
      RTP_ENABLE: "false"
      RTP_PORT_RANGE: "30000,30500"
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      REDIS_PWD: ${REDIS_PWD}
      # ---- MySQL ----
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "18080:18080/tcp"  # Web 页面 / 接口
      - "5060:5060/tcp"    # SIP 信令
      - "5060:5060/udp"    # SIP 信令
    volumes:
      - ./logs/wvp:/opt/wvp/logs
    networks:
      - wvp-net

networks:
  wvp-net:
    driver: bridge